steps:
  # 1. Build Docker image with Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/railsaathi-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/railsaathi-backend:latest', '.']

  # 2. Push Docker image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/railsaathi-backend:latest']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'railsaathi-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/railsaathi-backend:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/railsaathi-backend:latest'
